<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Oxford Design Studio{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css">
{% block head %}{% endblock %}
</head>
<body>

{% if user is defined and user %}
<nav class="nav">
  <div class="nav-brand">
    <span class="nav-firm">Oxford Design Studio</span>
  </div>
  <div class="nav-links">
    <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
    {% if user.role == 'admin' %}
    <a href="/upload"    class="nav-link {% if active_page == 'upload'    %}active{% endif %}">Upload Data</a>
    <a href="/designers" class="nav-link {% if active_page == 'designers' %}active{% endif %}">Designers</a>
    <a href="/users"     class="nav-link {% if active_page == 'users'     %}active{% endif %}">Users</a>
    {% endif %}
  </div>
  <div class="nav-right">
    <span class="nav-user">{{ user.email }}</span>
    <span class="nav-role role-{{ user.role }}">{{ user.role }}</span>
    <a href="/logout" class="nav-logout">Sign out</a>
  </div>
</nav>
{% endif %}

<main class="main">
  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
