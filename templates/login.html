<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Oxford Design Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <p class="login-firm">Oxford Design Studio</p>
      <h1 class="login-title">Profitability Dashboard</h1>
    </div>
    <div class="login-body-inner">
      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login" class="login-form">
        <div class="field">
          <label class="field-label">Email</label>
          <input class="field-input" type="email" name="email" required autofocus autocomplete="email">
        </div>
        <div class="field">
          <label class="field-label">Password</label>
          <input class="field-input" type="password" name="password" required autocomplete="current-password">
        </div>
        <button class="btn-primary full" type="submit">Sign In</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
